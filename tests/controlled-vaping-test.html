<!doctype html>
<html lang="de"><meta charset="utf-8"><title>Controlled Vaping regression tests</title>
<body><h1>Regressionstest: Zeitfenster</h1><pre id="out">TEST LÄUFT</pre>
<script src="../controlled-vaping-utils.js"></script>
<script>
const cases=[
 ['00:00',0],['05:59',0],['06:00',1],['11:59',1],
 ['12:00',2],['17:59',2],['18:00',3],['23:59',3],
 ['',-1],['9:30',1],['24:00',-1],['12:60',-1],['abc',-1],['12:3',-1]
];
const failures=[];
for(const [time,expected] of cases){
 const actual=window.MVAControlledVapingUtils.timeBucket(time);
 if(actual!==expected)failures.push(time+': erwartet '+expected+', erhalten '+actual);
}
const out=document.querySelector('#out');
if(failures.length){out.textContent='FEHLER: '+failures.join('; ');out.dataset.failed='true';}
else{out.textContent='ERGEBNIS: Alle '+cases.length+' Zeitfenster-Tests bestanden.';out.dataset.passed='true';}
</script></body></html>
